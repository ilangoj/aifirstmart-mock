# Run the AIFirstMart image on this computer (STANDARD.md section 8).
#   python afm.py deploy --target docker        # creates .env with fresh secrets if it is missing, then runs this
#   docker compose -f deploy/docker-compose.yml up --build -d
#   docker compose -f deploy/docker-compose.yml down        # stop (data stays in the afm-data volume)
# On a server, AFM_IMAGE names a published image and the build section is skipped (up --no-build).
services:
  afm:
    image: ${AFM_IMAGE:-aifirstmart-mock:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        AFM_EDITIONS: ${AFM_EDITIONS:-training,platform}
    env_file:
      - path: ../.env
        required: false
    environment:
      AFM_DB_PATH: /data/afm.sqlite
    ports:
      - "${AFM_HOST_PORT:-8080}:8080"
    volumes:
      - afm-data:/data
    restart: unless-stopped

volumes:
  afm-data:
