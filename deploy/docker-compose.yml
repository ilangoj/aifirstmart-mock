# Run the AIFirstMart image on this computer (STANDARD.md section 8).
#   python afm.py deploy --target docker        # creates .env with fresh secrets if it is missing, then runs this
#   docker compose -f deploy/docker-compose.yml up --build -d
#   docker compose -f deploy/docker-compose.yml down        # stop (data stays in the afm-data volume)
# On a server, AFM_IMAGE names a published image and the build section is skipped (up --no-build).
# PostgreSQL (profile "db"; python afm.py deploy --target database):
#   db        PostgreSQL 16; data kept in the pg-data volume; reachable from this computer on 127.0.0.1 only
#   db-setup  applies db/migrations, loads synthetic data into an empty database, runs the data-quality checks
services:
  afm:
    image: ${AFM_IMAGE:-aifirstmart-mock:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        AFM_EDITIONS: ${AFM_EDITIONS:-training,platform}
    env_file:
      - path: ../.env
        required: false
    environment:
      AFM_DB_PATH: /data/afm.sqlite
      # PostgreSQL for the API inside this container. Not AFM_DATABASE_URL from .env, which points at 127.0.0.1 for
      # the tools on this computer. With the database target running: postgresql://afm:<AFM_DB_PASSWORD>@db:5432/afm
      AFM_DATABASE_URL: ${AFM_APP_DATABASE_URL:-}
    ports:
      - "${AFM_HOST_PORT:-8080}:8080"
    volumes:
      - afm-data:/data
    restart: unless-stopped

  db:
    profiles: ["db"]
    image: postgres:16
    environment:
      POSTGRES_USER: afm
      POSTGRES_DB: afm
      POSTGRES_PASSWORD: ${AFM_DB_PASSWORD:-}          # PostgreSQL refuses to start without it; deploy --target database creates it
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${AFM_DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afm -d afm"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db-setup:
    profiles: ["db"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: db-tools
    image: aifirstmart-mock-db-tools:local
    environment:
      AFM_DATABASE_URL: postgresql://afm:${AFM_DB_PASSWORD}@db:5432/afm
      AFM_SEED_SCALE: ${AFM_SEED_SCALE:-small}
    command: ["sh", "-c", "python afm.py db migrate && python afm.py db seed --if-empty --scale $$AFM_SEED_SCALE && python afm.py db check"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  afm-data:
  pg-data:
