# Weekly update proposals; each one goes through CI like any other pull request (STANDARD.md section 6.7).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/backend"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: "/deploy"
    schedule: {interval: weekly}
