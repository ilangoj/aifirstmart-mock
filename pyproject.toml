# Settings for the tools only; the project is run with `python afm.py ...`, not installed as a package.
[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["dist", "site", "tools"]

[tool.ruff.lint]
# Python errors, undefined names, unused imports and variables (STANDARD.md sections 6.5 and 11)
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests/server"]
